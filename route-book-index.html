<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Route Book">
<title>Route Book — Merchant CRM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#57626F;
    --paper:#EEF1F4;
    --surface:#FFFFFF;
    --line:#D9DEE3;
    --accent:#2F5D8A;
    --accent-ink:#FFFFFF;
    --ok:#2F7D4F;
    --ok-bg:#E4F2E9;
    --warn:#C77F1D;
    --warn-bg:#FBEEDC;
    --bad:#B23A32;
    --bad-bg:#F8E6E4;
    --won:#2F7D4F;
    --lost:#8A8F96;
    --radius:10px;
    --tabbar-h:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(238,241,244,0.92);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    border-bottom:1px solid var(--line);
  }
  header.topbar h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  header.topbar p.sub{
    margin:2px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }
  main{
    flex:1;
    padding:14px 16px calc(var(--tabbar-h) + 28px);
  }
  nav.tabbar{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:560px;
    margin:0 auto;
    height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;
    z-index:30;
  }
  nav.tabbar button{
    flex:1;
    border:none;
    background:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    font-size:11px;
    color:var(--ink-soft);
    font-family:inherit;
    padding:6px 0 0;
  }
  nav.tabbar button .ic{font-size:20px; line-height:1; position:relative;}
  nav.tabbar button.active{color:var(--accent); font-weight:600;}
  nav.tabbar button .badge{
    position:absolute; top:-4px; right:-10px;
    background:var(--bad); color:#fff; font-size:9.5px; font-weight:700;
    min-width:15px; height:15px; border-radius:8px; padding:0 3px;
    display:flex; align-items:center; justify-content:center;
  }

  h2.section-title{
    font-size:13px;
    text-transform:none;
    color:var(--ink-soft);
    margin:20px 2px 8px;
    font-weight:600;
  }
  h2.section-title:first-child{margin-top:2px;}

  .ledger{
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .row:last-child{border-bottom:none;}
  .row .bar{
    width:4px; align-self:stretch; border-radius:2px; flex:none;
    min-height:36px;
  }
  .row .body{flex:1; min-width:0;}
  .row .biz{font-size:15px; font-weight:600; color:var(--ink);}
  .row .meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .row .when{font-size:12px; font-weight:600; flex:none; text-align:right; white-space:nowrap;}
  .chip{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
  }
  .chip.ok{background:var(--ok-bg); color:var(--ok);}
  .chip.warn{background:var(--warn-bg); color:var(--warn);}
  .chip.bad{background:var(--bad-bg); color:var(--bad);}
  .chip.won{background:var(--ok-bg); color:var(--won);}
  .chip.lost{background:#EEE; color:var(--lost);}

  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:38px 20px;
    background:var(--surface);
    border-radius:var(--radius);
    border:1px dashed var(--line);
  }

  label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:16px 2px 6px;}
  label:first-of-type{margin-top:2px;}
  input[type=text], input[type=date], input[type=datetime-local], textarea, select{
    width:100%;
    font-family:inherit;
    font-size:16px;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:64px;}
  .staff-row{display:flex; gap:8px; margin-bottom:8px;}
  .staff-row input{flex:1;}
  .staff-row button{flex:none; width:38px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--bad); font-size:18px; font-family:inherit;}
  .btn{
    display:block; width:100%;
    text-align:center;
    font-family:inherit;
    font-size:16px; font-weight:600;
    padding:13px;
    border-radius:10px;
    border:none;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-secondary{background:var(--surface); color:var(--accent); border:1px solid var(--line);}
  .btn-ghost{background:none; color:var(--ink-soft); border:1px solid var(--line);}
  .btn-add-staff{background:none; color:var(--accent); border:1px dashed var(--line); font-size:14px; padding:9px;}
  .stack > * + *{margin-top:10px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .detail-card{background:var(--surface); border-radius:var(--radius); border:1px solid var(--line); padding:16px;}
  .detail-card h3{margin:0 0 2px; font-size:19px;}
  .detail-card .owner{color:var(--ink-soft); font-size:14px; margin:0 0 10px;}
  .kv{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:14px;}
  .kv span:first-child{color:var(--ink-soft);}
  .kv span:last-child{font-weight:600; text-align:right; max-width:60%;}

  .history{margin-top:8px;}
  .hist-item{display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
  .hist-item .dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none;}
  .hist-item .txt{font-size:13.5px;}
  .hist-item .txt b{font-weight:600;}
  .hist-item .date{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}

  .action-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  .action-btn{
    padding:14px 10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-family:inherit;
    text-align:left;
    cursor:pointer;
  }
  .action-btn .t{font-size:14px; font-weight:700; display:block;}
  .action-btn .d{font-size:11.5px; color:var(--ink-soft); display:block; margin-top:2px;}
  .action-btn.pos{border-color:#BFE0CC;}
  .action-btn.pos .t{color:var(--ok);}
  .action-btn.warn{border-color:#F0D6A6;}
  .action-btn.warn .t{color:var(--warn);}
  .action-btn.neg{border-color:#E6BEBA;}
  .action-btn.neg .t{color:var(--bad);}

  .backbtn{background:none; border:none; color:var(--accent); font-family:inherit; font-size:16px; padding:6px 0 4px; cursor:pointer;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,26,33,0.4);
    display:flex; align-items:flex-end; z-index:50;
  }
  .modal{
    background:var(--surface);
    width:100%; max-width:560px; margin:0 auto;
    border-radius:16px 16px 0 0;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin-top:0;}
  .toast{
    position:fixed; bottom:calc(var(--tabbar-h) + 18px); left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-size:13.5px; padding:10px 16px; border-radius:20px;
    z-index:60; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  .note{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .backup-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .backup-card h3{margin:0 0 6px; font-size:15px;}
  .search{margin-bottom:12px;}
  .filter-row{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; padding-bottom:2px;}
  .filter-pill{flex:none; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-family:inherit;}
  .filter-pill.on{background:var(--accent); color:#fff; border-color:var(--accent);}
</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script type="module">
/* ================= CONFIG — paste your own values in here ================= */
// From Firebase console → Project settings → Your apps → (</>) web app.
const firebaseConfig = {
  apiKey: "AIzaSyCd5aejc-DxiyHe1xfTX2ukxppz2F8yk80",
  authDomain: "route-book-6441f.firebaseapp.com",
  projectId: "route-book-6441f",
  storageBucket: "route-book-6441f.firebasestorage.app",
  messagingSenderId: "635214103828",
  appId: "1:635214103828:web:899efb6de9b6eb91d5ee01"
};
// From Google Cloud console → APIs & Services → Credentials → OAuth client ID.
const GOOGLE_OAUTH_CLIENT_ID = "635214103828-dhbaml80eagi2njrvghoqq8lsum13662.apps.googleusercontent.com";
// Only Google accounts in this list may sign in and see data (also enforced
// server-side by the Firestore security rules — this is just the client UX).
const ALLOWED_EMAILS = ["jeremy@feistpos.com"];
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "PASTE_ME" && GOOGLE_OAUTH_CLIENT_ID.indexOf("PASTE_ME") !== 0;

/* ---------- Firebase (lazy-loaded only once configured) ---------- */
let fb = null; // {app, auth, db, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch}
async function loadFirebase(){
  if(fb || !FIREBASE_CONFIGURED) return fb;
  const [{initializeApp}, authMod, storeMod] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = authMod.getAuth(app);
  const db = storeMod.getFirestore(app);
  fb = {
    app, auth, db,
    GoogleAuthProvider: authMod.GoogleAuthProvider,
    signInWithRedirect: authMod.signInWithRedirect,
    getRedirectResult: authMod.getRedirectResult,
    onAuthStateChanged: authMod.onAuthStateChanged,
    signOut: authMod.signOut,
    collection: storeMod.collection, doc: storeMod.doc, setDoc: storeMod.setDoc,
    deleteDoc: storeMod.deleteDoc, onSnapshot: storeMod.onSnapshot, writeBatch: storeMod.writeBatch
  };
  return fb;
}

/* ---------- storage: localStorage cache + Firestore sync when signed in ---------- */
const STORE_KEY = 'routebook_v1';
function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {businesses:[]};
}
function saveData(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }catch(e){} }
let DATA = loadData();

/* ---------- auth state ---------- */
let AUTH_USER = null;       // Firebase user object, or null when signed out
let AUTH_CHECKED = false;   // becomes true once we know the sign-in state (avoids flashing the sign-in screen)
let UNSUB_SNAPSHOT = null;
let GMAIL_TOKEN = null;     // in-memory only Gmail send-scope access token

function bizCollection(){
  return fb.collection(fb.db, 'users', AUTH_USER.uid, 'businesses');
}
function sanitize(biz){
  // Firestore rejects `undefined` — drop the local-only helper fields and any undefined values.
  const {_queuedId, ...rest} = biz;
  const out = {};
  Object.keys(rest).forEach(k=>{ if(rest[k]!==undefined) out[k]=rest[k]; });
  return out;
}
function persistBusiness(biz){
  if(!fb || !AUTH_USER) return;
  fb.setDoc(fb.doc(bizCollection(), biz.id), sanitize(biz)).catch(()=>toast('Sync failed — will retry when online'));
}
function deleteBusinessRemote(id){
  if(!fb || !AUTH_USER) return;
  fb.deleteDoc(fb.doc(bizCollection(), id)).catch(()=>toast('Sync failed — will retry when online'));
}
function attachSnapshotListener(){
  if(!fb || !AUTH_USER) return;
  if(UNSUB_SNAPSHOT) UNSUB_SNAPSHOT();
  UNSUB_SNAPSHOT = fb.onSnapshot(bizCollection(), snap=>{
    DATA.businesses = snap.docs.map(d=>({id:d.id, ...d.data()}));
    saveData();
    render();
  }, ()=>toast('Sync connection lost'));
}
async function signInWithGoogle(){
  try{
    await loadFirebase();
    if(!fb) return;
    AUTH_INIT_ERROR = null;
    const provider = new fb.GoogleAuthProvider();
    fb.signInWithRedirect(fb.auth, provider);
  }catch(e){
    AUTH_INIT_ERROR = e && e.message ? e.message : 'Could not reach the sync service';
    render();
  }
}
async function signOutOfApp(){
  if(UNSUB_SNAPSHOT){ UNSUB_SNAPSHOT(); UNSUB_SNAPSHOT=null; }
  if(fb) await fb.signOut(fb.auth);
  AUTH_USER = null; GMAIL_TOKEN = null;
  render();
}
let AUTH_INIT_ERROR = null;
async function initAuth(){
  if(!FIREBASE_CONFIGURED){ AUTH_CHECKED = true; render(); return; }
  try{
    await loadFirebase();
    try{ await fb.getRedirectResult(fb.auth); }catch(e){ /* surfaced via onAuthStateChanged/UI as needed */ }
    fb.onAuthStateChanged(fb.auth, user=>{
      AUTH_CHECKED = true;
      if(user && ALLOWED_EMAILS.indexOf(user.email) === -1){
        toast('That Google account is not authorized for this app');
        fb.signOut(fb.auth);
        AUTH_USER = null; render(); return;
      }
      AUTH_USER = user;
      if(user) attachSnapshotListener();
      render();
    });
  }catch(e){
    AUTH_INIT_ERROR = e && e.message ? e.message : 'Could not reach the sync service';
    AUTH_CHECKED = true;
    render();
  }
}
/* ---------- Gmail send (separate OAuth scope via Google Identity Services) ---------- */
function waitForGIS(){
  return new Promise((resolve,reject)=>{
    const start = Date.now();
    (function poll(){
      if(window.google && window.google.accounts && window.google.accounts.oauth2) return resolve();
      if(Date.now()-start > 8000) return reject(new Error('Google sign-in script did not load'));
      setTimeout(poll, 150);
    })();
  });
}
function requestGmailToken(){
  return new Promise(async (resolve,reject)=>{
    try{ await waitForGIS(); }catch(e){ reject(e); return; }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_OAUTH_CLIENT_ID,
      scope: 'https://www.googleapis.com/auth/gmail.send',
      hint: AUTH_USER ? AUTH_USER.email : undefined,
      callback: (resp)=>{
        if(resp && resp.access_token){ GMAIL_TOKEN = resp.access_token; resolve(GMAIL_TOKEN); }
        else reject(new Error('No token returned'));
      }
    });
    client.requestAccessToken({prompt: GMAIL_TOKEN ? '' : 'consent'});
  });
}
function b64urlEncode(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sendGmail(toEmail, subject, body){
  if(!GMAIL_TOKEN){ await requestGmailToken(); }
  const mime = ['To: '+toEmail, 'Subject: '+subject, 'Content-Type: text/plain; charset=utf-8', '', body].join('\r\n');
  const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/messages/send', {
    method:'POST',
    headers:{ Authorization:'Bearer '+GMAIL_TOKEN, 'Content-Type':'application/json' },
    body: JSON.stringify({raw: b64urlEncode(mime)})
  });
  if(res.status===401){ GMAIL_TOKEN=null; await requestGmailToken(); return sendGmail(toEmail, subject, body); }
  if(!res.ok) throw new Error('Gmail send failed ('+res.status+')');
  return true;
}

/* ---------- helpers ---------- */
function uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'});
}
function fmtDateShort(iso){
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
}
function daysUntil(iso){
  const d = new Date(iso+'T12:00:00'), t = new Date(todayISO()+'T12:00:00');
  return Math.round((d-t)/86400000);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- status / urgency ---------- */
function urgency(biz){
  if(biz.closed) return 'closed';
  if(!biz.nextFollowUp) return 'none';
  const d = daysUntil(biz.nextFollowUp);
  if(d < 0) return 'overdue';
  if(d === 0) return 'today';
  if(d <= 7) return 'soon';
  return 'later';
}
function urgencyChip(biz){
  const u = urgency(biz);
  if(biz.closed === 'won') return '<span class="chip won">Signed</span>';
  if(biz.closed === 'lost') return '<span class="chip lost">Went another direction</span>';
  if(u==='overdue') return `<span class="chip bad">${-daysUntil(biz.nextFollowUp)}d overdue</span>`;
  if(u==='today') return '<span class="chip bad">Due today</span>';
  if(u==='soon') return `<span class="chip warn">Due ${fmtDateShort(biz.nextFollowUp)}</span>`;
  if(u==='later') return `<span class="chip ok">Due ${fmtDateShort(biz.nextFollowUp)}</span>`;
  return '';
}
function barColor(biz){
  const u = urgency(biz);
  if(biz.closed==='won') return 'var(--ok)';
  if(biz.closed==='lost') return 'var(--lost)';
  if(u==='overdue'||u==='today') return 'var(--bad)';
  if(u==='soon') return 'var(--warn)';
  return 'var(--ok)';
}
const ACTION_LABEL = {
  interested:'Interested — follow up in a week',
  meeting_set:'Meeting set',
  send_statement:'Sending their statement',
  callback_later:'Asked to check back later',
  gatekeeper:'Hit a gatekeeper',
  not_interested:'Not interested',
  undecided:'Undecided after meeting',
  signed:'Signed',
  demo_scheduled:'Demo scheduled',
  not_closed:"Didn't close — went another direction",
  first_contact:'First visit logged'
};
function mapsLink(address){
  if(!address) return '';
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address);
}
function parseCSV(text){
  // Minimal CSV parser: handles quoted fields with commas/escaped quotes.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c==='"' && n==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n' || c==='\r'){
        if(c==='\r' && n==='\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0]!=='') rows.push(row);
        row=[];
      } else field+=c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(c=>c && c.trim())).map(r=>{
    const obj = {};
    headers.forEach((h,i)=>obj[h]=(r[i]||'').trim());
    return obj;
  });
}
function pick(obj, keys){
  for(const k of keys){ if(obj[k]) return obj[k]; }
  return '';
}

/* ---------- state ---------- */
let VIEW = 'dashboard'; // dashboard | today | list | add | detail | backup
let DETAIL_ID = null;

/* ---------- render root ---------- */
function renderSetupNeeded(){
  return `
    <div style="padding:40px 20px; text-align:center;">
      <h2 style="margin-bottom:10px;">Almost there</h2>
      <p class="note">This copy of Route Book isn't connected to a sync account yet. Paste your Firebase config and Google OAuth client ID into the CONFIG section near the top of the script, then reload.</p>
    </div>`;
}
function renderSignIn(){
  return `
    <div style="padding:60px 20px; text-align:center;">
      <h2 style="margin-bottom:6px;">Route Book</h2>
      ${AUTH_INIT_ERROR
        ? `<p class="note" style="margin-bottom:24px; color:var(--bad);">Couldn't reach sync: ${escapeHtml(AUTH_INIT_ERROR)}. Check your connection and try again.</p>`
        : `<p class="note" style="margin-bottom:24px;">Sign in to sync your businesses across your phone, iPad, and computer.</p>`}
      <button class="btn btn-primary" id="signInBtn">${AUTH_INIT_ERROR?'Try again':'Sign in with Google'}</button>
    </div>`;
}
function render(){
  const app = document.getElementById('app');
  // Sync is opt-in: until real Firebase/Google config is pasted in, the app
  // just runs locally (same as before) with no sign-in required.
  if(FIREBASE_CONFIGURED){
    if(!AUTH_CHECKED){
      app.innerHTML = `<div style="padding:60px 20px; text-align:center;" class="note">Loading…</div>`;
      return;
    }
    if(!AUTH_USER){
      app.innerHTML = renderSignIn();
      const btn = document.getElementById('signInBtn');
      if(btn) btn.addEventListener('click', signInWithGoogle);
      return;
    }
  }
  let body = '';
  if(VIEW==='dashboard') body = renderDashboard();
  else if(VIEW==='today') body = renderToday();
  else if(VIEW==='list') body = renderList();
  else if(VIEW==='add') body = renderAdd();
  else if(VIEW==='detail') body = renderDetail();
  else if(VIEW==='backup') body = renderBackup();

  const queuedCount = DATA.businesses.filter(b=>b.queued).length;

  app.innerHTML = `
    <header class="topbar">
      <h1>${headerTitle()}</h1>
      <p class="sub">${headerSub()}</p>
    </header>
    <main>${body}</main>
    <nav class="tabbar">
      <button data-tab="dashboard" class="${VIEW==='dashboard'?'active':''}"><span class="ic">◔</span>Dashboard</button>
      <button data-tab="today" class="${VIEW==='today'?'active':''}"><span class="ic">📍${queuedCount?'<span class="badge">'+queuedCount+'</span>':''}</span>Today</button>
      <button data-tab="list" class="${VIEW==='list'?'active':''}"><span class="ic">☰</span>Businesses</button>
      <button data-tab="add" class="${VIEW==='add'?'active':''}"><span class="ic">＋</span>Add</button>
      <button data-tab="backup" class="${VIEW==='backup'?'active':''}"><span class="ic">⤓</span>Backup</button>
    </nav>
  `;
  bindTabs();
  bindViewHandlers();
}
function headerTitle(){
  if(VIEW==='dashboard') return 'Route Book';
  if(VIEW==='today') return "Today's Route";
  if(VIEW==='list') return 'Businesses';
  if(VIEW==='add') return 'Log a Visit';
  if(VIEW==='detail'){ const b = DATA.businesses.find(x=>x.id===DETAIL_ID); return b? b.businessName : 'Business'; }
  if(VIEW==='backup') return 'Backup & Import';
}
function headerSub(){
  if(VIEW==='dashboard') return new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  if(VIEW==='today') return 'Imported stops not yet visited';
  if(VIEW==='list'){ const n = DATA.businesses.filter(b=>!b.queued).length; return `${n} stop${n===1?'':'s'} on record`; }
  if(VIEW==='add') return 'New stop or new contact at an existing stop';
  if(VIEW==='detail'){ const b = DATA.businesses.find(x=>x.id===DETAIL_ID); return b? (b.ownerName||'No owner name on file') : ''; }
  if(VIEW==='backup') return 'Everything stays on this phone';
}
function bindTabs(){
  document.querySelectorAll('nav.tabbar button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      VIEW = btn.dataset.tab;
      if(VIEW==='add') ADD_DRAFT = null;
      render();
    });
  });
}

/* ================= DASHBOARD ================= */
function statsSummary(){
  const visited = DATA.businesses.filter(b=>!b.queued);
  const count = k => visited.filter(b=>b.lastAction===k).length;
  const total = visited.length;
  const won = visited.filter(b=>b.closed==='won').length;
  const lost = visited.filter(b=>b.closed==='lost').length;
  const warm = count('send_statement')+count('callback_later')+count('meeting_set')+count('demo_scheduled')+won;
  const rate = total? Math.round(warm/total*100) : 0;
  return {total, statement:count('send_statement'), callback:count('callback_later'), meeting:count('meeting_set')+count('demo_scheduled'), won, lost, rate};
}
function renderStatsBar(){
  const s = statsSummary();
  if(!s.total) return '';
  return `
    <div class="detail-card" style="margin-bottom:16px;">
      <div class="kv" style="border-top:none; padding-top:0;"><span>Total logged</span><span>${s.total}</span></div>
      <div class="kv"><span>Send Statement</span><span>${s.statement}</span></div>
      <div class="kv"><span>Callbacks</span><span>${s.callback}</span></div>
      <div class="kv"><span>Meetings / Demos</span><span>${s.meeting}</span></div>
      <div class="kv"><span>Signed</span><span>${s.won}</span></div>
      <div class="kv"><span>Warm outcome rate</span><span>${s.rate}%</span></div>
    </div>
  `;
}
function renderDashboard(){
  const active = DATA.businesses.filter(b=>!b.queued && !b.closed && b.nextFollowUp);
  const overdue = active.filter(b=>daysUntil(b.nextFollowUp) < 0).sort((a,c)=>a.nextFollowUp.localeCompare(c.nextFollowUp));
  const today = active.filter(b=>daysUntil(b.nextFollowUp) === 0);
  const soon = active.filter(b=>{const d=daysUntil(b.nextFollowUp); return d>0 && d<=7;}).sort((a,c)=>a.nextFollowUp.localeCompare(c.nextFollowUp));
  const noOutcome = DATA.businesses.filter(b=>!b.queued && !b.closed && !b.nextFollowUp);
  const queued = DATA.businesses.filter(b=>b.queued).length;

  if(!DATA.businesses.length){
    return `<div class="empty">No stops logged yet.<br><br>Tap <b>Add</b> to log your first visit, or import tonight's list from the <b>Backup</b> tab.</div>`;
  }

  let html = renderStatsBar();
  if(queued){
    html += `<div class="empty" style="text-align:left; padding:16px 18px; margin-bottom:16px;" data-open-today>📍 <b>${queued}</b> stop${queued===1?'':'s'} queued for today — tap to open <b>Today's Route</b>.</div>`;
  }
  if(overdue.length){
    html += `<h2 class="section-title">Go back — overdue (${overdue.length})</h2>`;
    html += bizLedger(overdue);
  }
  if(today.length){
    html += `<h2 class="section-title">Due today</h2>`;
    html += bizLedger(today);
  }
  if(soon.length){
    html += `<h2 class="section-title">Coming up this week</h2>`;
    html += bizLedger(soon);
  }
  if(noOutcome.length){
    html += `<h2 class="section-title">Needs an outcome logged</h2>`;
    html += bizLedger(noOutcome);
  }
  if(!overdue.length && !today.length && !soon.length && !noOutcome.length){
    html += `<div class="empty">You're clear. Nothing due this week.</div>`;
  }
  return html;
}
function bizLedger(list){
  return `<div class="ledger">${list.map(b=>`
    <div class="row" data-open="${b.id}">
      <div class="bar" style="background:${barColor(b)}"></div>
      <div class="body">
        <div class="biz">${escapeHtml(b.businessName)}</div>
        <div class="meta">${escapeHtml(b.ownerName||'No owner listed')} · ${ACTION_LABEL[b.lastAction]||''}</div>
      </div>
      <div class="when">${urgencyChip(b)}</div>
    </div>
  `).join('')}</div>`;
}

/* ================= LIST ================= */
let LIST_FILTER = 'all';
let LIST_SEARCH = '';
function renderList(){
  let list = DATA.businesses.filter(b=>!b.queued);

  if(LIST_FILTER==='won') list = list.filter(b=>b.closed==='won');
  if(LIST_FILTER==='lost') list = list.filter(b=>b.closed==='lost');

    const q = LIST_SEARCH.toLowerCase();
    list = list.filter(b=> (b.businessName+' '+(b.ownerName||'')).toLowerCase().includes(q));

  list.sort((a,c)=> (a.nextFollowUp||'9999').localeCompare(c.nextFollowUp||'9999'));

  return `
    <input class="search" type="text" placeholder="Search businesses…" id="searchBox" value="${escapeHtml(LIST_SEARCH)}">

/* ================= event binding ================= */
function bindViewHandlers(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{ DETAIL_ID = el.dataset.open; VIEW='detail'; render(); });
  });
  document.querySelectorAll('[data-open-today]').forEach(el=>{
    el.addEventListener('click', ()=>{ VIEW='today'; render(); });
  });
  document.querySelectorAll('[data-log-visit]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const b = DATA.businesses.find(x=>x.id===el.dataset.logVisit);
      if(!b) return;
      ADD_DRAFT = {
        businessName:b.businessName, address:b.address||'', ownerName:b.ownerName||'',
        phone:b.phone||'', email:b.email||'', posSystem:b.posSystem||'', processor:b.processor||'',
        notes:b.notes||'', staff:[''], _queuedId:b.id
      };
      VIEW='add'; render();
    });
  });
  document.querySelectorAll('[data-skip-queued]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      DATA.businesses = DATA.businesses.filter(b=>b.id!==el.dataset.skipQueued);
      deleteBusinessRemote(el.dataset.skipQueued);
      saveData(); render(); toast('Removed from today\'s route');
    });
  });

  if(VIEW==='list'){
    const sb = document.getElementById('searchBox');
    if(sb) sb.addEventListener('input', e=>{ LIST_SEARCH = e.target.value; render(); setTimeout(()=>{const el=document.getElementById('searchBox'); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;}},0); });
    document.querySelectorAll('[data-filter]').forEach(el=>{
      el.addEventListener('click', ()=>{ LIST_FILTER = el.dataset.filter; render(); });
    });
  }

  if(VIEW==='add'){
    document.getElementById('f_biz').addEventListener('input', e=>ADD_DRAFT.businessName=e.target.value);
    document.getElementById('f_address').addEventListener('input', e=>ADD_DRAFT.address=e.target.value);
    document.getElementById('f_owner').addEventListener('input', e=>ADD_DRAFT.ownerName=e.target.value);
    document.getElementById('f_phone').addEventListener('input', e=>ADD_DRAFT.phone=e.target.value);
    document.getElementById('f_email').addEventListener('input', e=>ADD_DRAFT.email=e.target.value);
    document.getElementById('f_pos').addEventListener('input', e=>ADD_DRAFT.posSystem=e.target.value);
    document.getElementById('f_processor').addEventListener('input', e=>ADD_DRAFT.processor=e.target.value);
    document.getElementById('f_notes').addEventListener('input', e=>ADD_DRAFT.notes=e.target.value);
    document.querySelectorAll('[data-staff-idx]').forEach(el=>{
      el.addEventListener('input', e=>{ ADD_DRAFT.staff[+el.dataset.staffIdx] = e.target.value; });
    });
    document.querySelectorAll('[data-remove-staff]').forEach(el=>{
      el.addEventListener('click', ()=>{ ADD_DRAFT.staff.splice(+el.dataset.removeStaff,1); render(); });
    });
    document.getElementById('addStaffBtn').addEventListener('click', ()=>{ ADD_DRAFT.staff.push(''); render(); focusLastStaff(); });
    document.getElementById('saveVisitBtn').addEventListener('click', saveNewVisit);
  }

  if(VIEW==='detail'){
    const back = document.querySelector('[data-back]');
    if(back) back.addEventListener('click', ()=>{ VIEW='list'; render(); });
    document.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', ()=>handleAction(el.dataset.action));
    });
    const editBtn = document.getElementById('editBizBtn');
    if(editBtn) editBtn.addEventListener('click', ()=>openEditModal(DATA.businesses.find(x=>x.id===DETAIL_ID)));
    const emailBtn = document.getElementById('emailBizBtn');
    if(emailBtn) emailBtn.addEventListener('click', ()=>openEmailModal(DATA.businesses.find(x=>x.id===DETAIL_ID)));
    const undoBtn = document.getElementById('undoActionBtn');
    if(undoBtn) undoBtn.addEventListener('click', ()=>handleUndo());
    const del = document.getElementById('deleteBizBtn');
    if(del) del.addEventListener('click', ()=>{
      if(confirm('Delete this business and its whole history? This can\'t be undone.')){
        DATA.businesses = DATA.businesses.filter(b=>b.id!==DETAIL_ID);
        deleteBusinessRemote(DETAIL_ID);
        saveData(); VIEW='list'; render(); toast('Deleted');
      }
    });
  }

  if(VIEW==='backup'){
    const signOutBtn = document.getElementById('signOutBtn');
    if(signOutBtn) signOutBtn.addEventListener('click', signOutOfApp);
    document.getElementById('exportBtn').addEventListener('click', exportBackup);
    document.getElementById('importFile').addEventListener('change', importBackup);
    document.getElementById('importCsvBtn').addEventListener('click', importCsvRoute);
    document.getElementById('importCsvFile').addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = evt=>{ document.getElementById('importCsvText').value = evt.target.result; };
      reader.readAsText(file);
    });
  }
}
function focusLastStaff(){
  const inputs = document.querySelectorAll('[data-staff-idx]');
  if(inputs.length) inputs[inputs.length-1].focus();
}

function saveNewVisit(){
  const d = ADD_DRAFT;
  if(!d.businessName.trim()){ toast('Business name is required'); return; }
  const dateEl = document.getElementById('f_date');
  const visitDate = dateEl.value || todayISO();
  const fields = {
    businessName: d.businessName.trim(),
    address: d.address.trim(),
    ownerName: d.ownerName.trim(),
    phone: d.phone.trim(),
    email: d.email.trim(),
    posSystem: d.posSystem.trim(),
    processor: d.processor.trim(),
    notes: d.notes.trim(),
    staff: d.staff.map(s=>s.trim()).filter(Boolean)
  };
  let biz;
  if(d._queuedId && (biz = DATA.businesses.find(x=>x.id===d._queuedId))){
    Object.assign(biz, fields);
    biz.queued = false;
    biz.firstContactDate = visitDate;
    biz.lastAction = 'first_contact';
    if(!biz.history) biz.history = [];
    biz.history.push({date:visitDate, label:'First visit logged', note: d.processor? ('Processor: '+d.processor):(d.posSystem? ('POS: '+d.posSystem):'')});
  } else {
    biz = {
      id: uid(),
      ...fields,
      firstContactDate: visitDate,
      lastAction: 'first_contact',
      hadMeeting: false,
      nextFollowUp: null,
      closed: null,
      meetingDateTime: null,
      queued: false,
      undoStack: [],
      history: [{date:visitDate, label:'First visit logged', note: d.processor? ('Processor: '+d.processor):(d.posSystem? ('POS: '+d.posSystem):'')}]
    };
    DATA.businesses.push(biz);
  }
  saveData();
  persistBusiness(biz);
  ADD_DRAFT = null;
  DETAIL_ID = biz.id;
  VIEW = 'detail';
  render();
  toast('Visit logged — choose what happened');
}

function snapshot(b){
  if(!b.undoStack) b.undoStack = [];
  b.undoStack.push({
    lastAction:b.lastAction, hadMeeting:b.hadMeeting, nextFollowUp:b.nextFollowUp,
    closed:b.closed, meetingDateTime:b.meetingDateTime
  });
}
function handleUndo(){
  const b = DATA.businesses.find(x=>x.id===DETAIL_ID);
  if(!b || !(b.undoStack||[]).length) return;
  const prev = b.undoStack.pop();
  b.lastAction = prev.lastAction;
  b.hadMeeting = prev.hadMeeting;
  b.nextFollowUp = prev.nextFollowUp;
  b.closed = prev.closed;
  b.meetingDateTime = prev.meetingDateTime;
  if(b.history.length > 1) b.history.pop();
  saveData(); persistBusiness(b); render(); toast('Reverted to previous step');
}

function openEmailModal(b){
  if(!b) return;
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  const defaultSubject = 'Following up — '+b.businessName;
  const defaultBody = 'Hi '+(b.ownerName||'there')+',\n\n';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Email ${escapeHtml(b.businessName)}</h3>
      <label>To</label>
      <input type="text" id="em_to" value="${escapeHtml(b.email)}">
      <label>Subject</label>
      <input type="text" id="em_subject" value="${escapeHtml(defaultSubject)}">
      <label>Message</label>
      <textarea id="em_body" rows="6">${escapeHtml(defaultBody)}</textarea>
      <p class="note" id="em_status" style="margin-top:8px;">Sends from ${GMAIL_TOKEN?'your connected Gmail':(AUTH_USER?AUTH_USER.email:'your Google account')}.</p>
      <button class="btn btn-primary" id="sendEmailBtn" style="margin-top:14px;">${GMAIL_TOKEN?'Send':'Connect Gmail & Send'}</button>
      <a class="btn btn-secondary" id="mailtoFallback" style="margin-top:10px;" href="#">Open in Mail app instead</a>
      <button class="btn btn-ghost" id="cancelEmail" style="margin-top:10px;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('cancelEmail').addEventListener('click', ()=>overlay.remove());
  const buildMailto = ()=>{
    const to = document.getElementById('em_to').value.trim();
    const subject = document.getElementById('em_subject').value;
    const body = document.getElementById('em_body').value;
    return 'mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  };
  document.getElementById('mailtoFallback').addEventListener('click', (e)=>{ e.currentTarget.href = buildMailto(); });
  document.getElementById('sendEmailBtn').addEventListener('click', async ()=>{
    const to = document.getElementById('em_to').value.trim();
    const subject = document.getElementById('em_subject').value.trim();
    const body = document.getElementById('em_body').value;
    if(!to){ toast('Add a recipient'); return; }
    const btn = document.getElementById('sendEmailBtn');
    btn.textContent = 'Sending…'; btn.disabled = true;
    try{
      await sendGmail(to, subject, body);
      const today = todayISO();
      if(!b.history) b.history = [];
      b.history.push({date:today, label:'Emailed', note:subject});
      saveData(); persistBusiness(b);
      overlay.remove(); render();
      toast('Email sent');
    }catch(err){
      btn.textContent = 'Send'; btn.disabled = false;
      document.getElementById('em_status').textContent = 'Could not send — check the "Open in Mail app instead" link below, or try again.';
    }
  });
}
function handleAction(action){
  const b = DATA.businesses.find(x=>x.id===DETAIL_ID);
  if(!b) return;

  if(action==='meeting_set'){ openMeetingModal(b, 'meeting_set'); return; }
  if(action==='demo_scheduled'){ openMeetingModal(b, 'demo_scheduled'); return; }
  if(action==='not_interested'){ openNotInterestedModal(b); return; }
  if(action==='callback_later'){ openCallbackModal(b); return; }

  snapshot(b);
  const today = todayISO();
  if(action==='interested'){
    b.lastAction='interested'; b.nextFollowUp = addDays(today,7);
    b.history.push({date:today, label:ACTION_LABEL.interested});
  } else if(action==='send_statement'){
    b.lastAction='send_statement'; b.nextFollowUp = addDays(today,4);
    b.history.push({date:today, label:ACTION_LABEL.send_statement, note:'Follow up if statement hasn\'t arrived'});
  } else if(action==='gatekeeper'){
    b.lastAction='gatekeeper'; b.nextFollowUp = addDays(today,30);
    b.history.push({date:today, label:ACTION_LABEL.gatekeeper});
  } else if(action==='undecided'){
    b.lastAction='undecided'; b.nextFollowUp = addDays(today,7);
    b.history.push({date:today, label:ACTION_LABEL.undecided});
  } else if(action==='signed'){
    b.lastAction='signed'; b.nextFollowUp=null; b.closed='won';
    b.history.push({date:today, label:ACTION_LABEL.signed});
  } else if(action==='not_closed'){
    b.lastAction='not_closed'; b.nextFollowUp=null; b.closed='lost';
    b.history.push({date:today, label:ACTION_LABEL.not_closed});
  }
  saveData(); persistBusiness(b); render(); toast('Updated');
}

function openNotInterestedModal(b){

  overlay.className='modal-overlay';

    <div class="modal">

      <div class="stack" style="margin-top:14px;">
        <button class="btn btn-secondary" data-mo="90">Come back in 3 months</button>
        <button class="btn btn-secondary" data-mo="180">Come back in 6 months</button>
        <button class="btn btn-ghost" data-mo="cancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

    b.history.push({date:today, label:ACTION_LABEL.not_interested, note:(days===90?'3 month':'6 month')+' revisit'});

  });
}

function openMeetingModal(b, action){
  const isDemo = action==='demo_scheduled';
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  const now = new Date(); now.setMinutes(0,0,0); now.setHours(now.getHours()+24);
  const defaultVal = now.toISOString().slice(0,16);
  overlay.innerHTML = `
    <div class="modal">
      <h3>${isDemo? 'Schedule the demo' : 'Set the meeting'}</h3>
      <label>Date & time</label>
      <input type="datetime-local" id="meetingDT" value="${defaultVal}">
      <button class="btn btn-primary" id="confirmMeeting" style="margin-top:18px;">Save & add to calendar</button>
      <button class="btn btn-ghost" id="cancelMeeting" style="margin-top:10px;">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('cancelMeeting').addEventListener('click', ()=>overlay.remove());
  document.getElementById('confirmMeeting').addEventListener('click', ()=>{
    const val = document.getElementById('meetingDT').value;
    if(!val){ toast('Pick a date & time'); return; }
    const today = todayISO();
    const dt = new Date(val);
    const followUpDate = dt.toISOString().slice(0,10);
    snapshot(b);
    if(isDemo){
      b.lastAction='demo_scheduled'; b.nextFollowUp = followUpDate;
      b.history.push({date:today, label:ACTION_LABEL.demo_scheduled, note:'Demo on '+fmtDate(followUpDate)});
    } else {
      b.lastAction='meeting_set'; b.hadMeeting=true; b.meetingDateTime = dt.toISOString(); b.nextFollowUp = followUpDate;
      b.history.push({date:today, label:ACTION_LABEL.meeting_set, note:'Meeting on '+fmtDate(followUpDate)});
    }
    saveData();
    persistBusiness(b);
    downloadICS(b, dt, isDemo? 'Demo' : 'Meeting');
    overlay.remove(); render(); toast('Saved — opening calendar file');
  });
}

function downloadICS(b, dt, kind){
  const end = new Date(dt.getTime()+60*60*1000);
  const fmt = d=> d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RouteBook//EN','BEGIN:VEVENT',
    'UID:'+uid()+'@routebook',
    'DTSTAMP:'+fmt(new Date()),
    'DTSTART:'+fmt(dt),
    'DTEND:'+fmt(end),
    'SUMMARY:'+kind+' — '+b.businessName,
    'DESCRIPTION:'+kind+' with '+(b.ownerName||'contact')+' at '+b.businessName,
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = b.businessName.replace(/[^a-z0-9]+/gi,'_')+'_'+kind.toLowerCase()+'.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/* ================= route import ================= */
function importCsvRoute(){
  const text = document.getElementById('importCsvText').value;
  if(!text.trim()){ toast('Paste or choose a CSV first'); return; }
  let rows;
  try{ rows = parseCSV(text); }catch(e){ toast('Could not read that CSV'); return; }
  if(!rows.length){ toast('No rows found'); return; }
  const existingKey = b => (b.businessName+'|'+b.address).toLowerCase();
  const existing = new Set(DATA.businesses.map(existingKey));
  const today = todayISO();
  let added = 0;
  rows.forEach(r=>{
    const businessName = pick(r, ['business name','business','name']);
    if(!businessName) return;
    const city = pick(r, ['city']);
    let address = pick(r, ['address','address (city)']);
    if(city && !address.toLowerCase().includes(city.toLowerCase())) address = address ? address+', '+city : city;
    const contact = pick(r, ['contact info','contact','phone','email']);
    const owner = pick(r, ['owner/agent name','owner','owner/agent']);
    const notesParts = [pick(r,['note','notes'])];
    if(owner) notesParts.unshift('Owner/agent: '+owner);
    const notes = notesParts.filter(Boolean).join(' — ');
    const key = (businessName+'|'+address).toLowerCase();
    if(existing.has(key)) return;
    existing.add(key);
    const biz = {
      id: uid(), businessName, address, ownerName:'', phone:/\d{3}.*\d{4}/.test(contact)?contact:'',
      email: contact.includes('@')?contact:'', posSystem:'', processor:'', notes,
      staff:[], firstContactDate:null, lastAction:null, hadMeeting:false, nextFollowUp:null,
      closed:null, meetingDateTime:null, queued:true, routeDate:today, undoStack:[], history:[]
    };
    DATA.businesses.push(biz);
    persistBusiness(biz);
    added++;
  });
  saveData();
  document.getElementById('importCsvText').value='';
  render();
  toast(added ? `Added ${added} stop${added===1?'':'s'} to Today` : 'Nothing new to add — already on file');
}

/* ================= backup ================= */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayISO();
  a.href = url; a.download = 'routebook-backup-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Backup file created');
}
function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed || !Array.isArray(parsed.businesses)) throw new Error('bad format');
      const syncNote = (fb && AUTH_USER) ? ' and your synced data' : '';
      if(!confirm('This replaces all data currently on this phone'+syncNote+' with the backup file. Continue?')) return;
      DATA = parsed;
      DATA.businesses.forEach(b=>{ if(!b.id) b.id = uid(); persistBusiness(b); });
      saveData();
      VIEW='dashboard';
      render();
      toast('Restored from backup');
    }catch(err){
      alert('That file doesn\'t look like a Route Book backup.');
    }
  };
  reader.readAsText(file);
}
